<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apni Vidya — Smart Examination &amp; Assessment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*STYLES*/
</style>
</head>
<body>

<div class="intro">
  <div class="eyebrow">Apni Vidya · Smart Examination &amp; Assessment</div>
  <h1>Conduct → Evaluate → Analyse → Improve</h1>
  <p>Every screen below is connected to a live backend. Create a test, publish it, sit it as a student, and watch the analysis appear on both sides.</p>
</div>

<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="phone-screen">
      <div class="status-row"><span id="statusclock">9:41</span>
        <div class="status-icons">
          <svg width="16" height="11" viewBox="0 0 16 11"><rect x="0" y="6" width="3" height="5" fill="currentColor"/><rect x="4.5" y="4" width="3" height="7" fill="currentColor"/><rect x="9" y="2" width="3" height="9" fill="currentColor"/><rect x="13.5" y="0" width="2" height="11" fill="currentColor"/></svg>
          <svg width="22" height="11" viewBox="0 0 22 11"><rect x="0.5" y="0.5" width="19" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="14" height="7" rx="1.3" fill="currentColor"/><rect x="20.5" y="3.5" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
        </div>
      </div>
      <div id="header-area"></div>
      <div id="app" style="flex:1;display:flex;flex-direction:column;overflow:hidden;"></div>
      <div class="bottom-nav" id="nav-area"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
// Real clock in the status bar — the app is live, so a frozen 9:41 would be
// the one dishonest pixel on the screen.
function tickStatusClock() {
  document.getElementById('statusclock').textContent =
    new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
tickStatusClock();
setInterval(tickStatusClock, 20000);
</script>
<script>
/*SCRIPT*/
</script>
</body>
</html>
