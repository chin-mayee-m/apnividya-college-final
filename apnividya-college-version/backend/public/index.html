<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apni Vidya — Smart Examination &amp; Assessment System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --paper:#F7F2E7; --paper-card:#FFFDF8; --ink:#1E2A3A; --ink-soft:#697489; --ink-faint:#9AA3B2;
    --rule:#E4DBC7; --margin-red:#B8483C; --teal:#0E6E5C; --teal-light:#E1EFEA;
    --gold:#B8860B; --amber:#D98E04; --amber-light:#FBF0DC; --burnt:#C1652C;
    --coral:#B8483C; --coral-light:#F7E7E3;
    --shadow: 0 1px 2px rgba(30,42,58,0.06), 0 8px 24px -12px rgba(30,42,58,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:#EDE6D6; font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh; padding:32px 16px 64px; }
  .intro{ max-width:640px; margin:0 auto 24px; text-align:center; }
  .intro .eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--margin-red); font-weight:700; margin-bottom:10px;}
  .intro h1{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; letter-spacing:-0.01em; margin-bottom:8px;}
  .intro p{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; max-width:480px; margin:0 auto;}
  .mode-toggle{ display:flex; justify-content:center; gap:8px; margin-bottom:22px;}
  .mode-btn{ font-family:'Inter'; font-weight:700; font-size:12px; padding:9px 16px; border-radius:999px; border:1px solid var(--rule); background:var(--paper-card); color:var(--ink-soft); cursor:pointer;}
  .mode-btn.active{ background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .option-btn{ padding:11px 13px; border:1.5px solid var(--rule); border-radius:11px; font-size:12px; font-weight:600; margin-bottom:8px; cursor:pointer; background:var(--paper-card); transition:all .12s;}
  .option-btn:last-child{ margin-bottom:0;}
  .option-btn.selected{ border-color:var(--teal); background:var(--teal-light); color:var(--teal);}
  .you-row{ background:var(--teal-light); border-radius:12px; margin:0 -6px; padding-left:10px; padding-right:6px;}
  .you-pill{ font-size:8.5px; background:var(--teal); color:#fff; padding:2px 6px; border-radius:99px; font-weight:800; vertical-align:middle; margin-left:5px;}
  .stage{ display:flex; justify-content:center; }
  .phone{ width:336px; background:#111823; border-radius:46px; padding:12px; box-shadow:0 30px 60px -20px rgba(20,20,30,0.45), 0 4px 12px rgba(20,20,30,0.2); position:relative;}
  .phone-screen{ width:100%; height:700px; background: linear-gradient(to right, transparent 0 37px, rgba(184,72,60,0.35) 37px 38px, transparent 38px 39px, rgba(184,72,60,0.12) 39px 40px, transparent 40px), repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--rule) 27px, var(--rule) 28px); border-radius:34px; overflow:hidden; position:relative; display:flex; flex-direction:column;}
  .notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:26px; background:#111823; border-radius:20px; z-index:20;}
  .status-row{ display:flex; justify-content:space-between; align-items:center; padding:16px 22px 4px; font-family:'Inter'; font-weight:700; font-size:14px; flex-shrink:0;}
  .status-icons{ display:flex; gap:5px; align-items:center;}
  .scroll-area{ flex:1; overflow-y:auto; padding-bottom:8px;}
  .scroll-area::-webkit-scrollbar{ width:0;}
  .app-header{ padding:10px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .app-header.simple{ gap:12px; justify-content:flex-start;}
  .icon-btn{ width:34px; height:34px; border-radius:50%; background:var(--paper-card); border:1px solid var(--rule); display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0; position:relative; cursor:pointer;}
  .icon-btn .dot{ position:absolute; top:6px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--margin-red); border:1.5px solid var(--paper);}
  .greet-eyebrow{ font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .greet-name{ font-family:'Fraunces'; font-weight:600; font-size:22px; margin-top:2px;}
  .greet-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:2px; font-weight:500;}
  .header-title{ font-family:'Fraunces'; font-weight:600; font-size:18px;}
  .card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:16px; box-shadow:var(--shadow);}
  .section{ padding:0 20px; margin-bottom:18px;}
  .section-title{ font-family:'Fraunces'; font-weight:600; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .section-title .link{ font-family:'Inter'; font-weight:600; font-size:11.5px; color:var(--teal); cursor:pointer; background:none; border:none;}
  .hero-cta{ margin:4px 20px 20px; background:var(--ink); border-radius:18px; padding:20px; color:var(--paper); position:relative; overflow:hidden; cursor:pointer;}
  .hero-cta::before{ content:""; position:absolute; right:-30px; top:-30px; width:120px;height:120px;border-radius:50%; border:1px solid rgba(247,242,231,0.15);}
  .hero-cta::after{ content:""; position:absolute; right:-10px; top:-10px; width:80px;height:80px;border-radius:50%; border:1px solid rgba(247,242,231,0.12);}
  .hero-cta .eyebrow{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#E7A79E; font-weight:700; margin-bottom:8px;}
  .hero-cta h3{ font-family:'Fraunces'; font-weight:600; font-size:19px; margin-bottom:6px; max-width:210px;}
  .hero-cta p{ font-size:12px; color:#B9C1D0; margin-bottom:16px; max-width:200px; line-height:1.5;}
  .btn{ display:inline-flex; align-items:center; gap:8px; font-family:'Inter'; font-weight:700; font-size:12.5px; background:var(--teal); color:#fff; border:none; padding:11px 18px; border-radius:11px; cursor:pointer;}
  .btn:disabled{ opacity:.45; cursor:not-allowed;}
  .btn.full{ width:100%; justify-content:center; padding:14px; font-size:13.5px;}
  .btn.ghost{ background:transparent; border:1.5px solid var(--rule); color:var(--ink);}
  .btn.sm{ padding:8px 13px; font-size:11.5px;}
  .dropdown{ font-family:'Inter'; font-weight:600; font-size:12px; color:var(--ink); background:var(--paper-card); border:1px solid var(--rule); border-radius:10px; padding:9px 12px; display:flex; align-items:center; gap:8px; justify-content:space-between; width:100%;}
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .stat-card{ background:var(--paper-card); border:1px solid var(--rule); border-radius:14px; padding:14px 14px 12px;}
  .stat-card .icon-wrap{ width:26px; height:26px; border-radius:8px; background:var(--teal-light); color:var(--teal); display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
  .stat-num{ font-family:'Fraunces'; font-weight:600; font-size:22px; line-height:1;}
  .stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:5px; font-weight:600;}
  .quick-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .quick-item{ background:var(--paper-card); border:1px solid var(--rule); border-radius:14px; padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:10px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .quick-item .ic{ color:var(--ink);}
  .bottom-nav{ flex-shrink:0; display:flex; justify-content:space-around; align-items:center; background:var(--paper-card); border-top:1px solid var(--rule); padding:11px 6px 14px;}
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-faint); cursor:pointer; background:none; border:none;}
  .nav-item.active{ color:var(--teal);}
  .nav-item span{ font-size:9.5px; font-weight:700;}
  .uline-tabs{ display:flex; gap:22px; padding:2px 20px 12px; border-bottom:1px solid var(--rule); margin-bottom:16px;}
  .uline-tabs .t{ font-size:12.5px; font-weight:700; color:var(--ink-faint); padding-bottom:10px; position:relative; cursor:pointer; background:none; border:none;}
  .uline-tabs .t.active{ color:var(--ink);}
  .uline-tabs .t.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--margin-red); border-radius:2px;}
  .test-card{ padding:16px; margin-bottom:12px; cursor:pointer;}
  .test-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
  .test-name{ font-family:'Fraunces'; font-weight:600; font-size:15px; max-width:210px;}
  .test-sub{ font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:3px; margin-bottom:12px;}
  .meta-row{ display:flex; gap:16px; margin-bottom:6px;}
  .meta{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-soft); font-weight:600;}
  .pill{ font-size:10px; font-weight:700; padding:4px 10px; border-radius:999px; flex-shrink:0;}
  .pill.upcoming{ background:var(--amber-light); color:var(--amber);}
  .pill.ongoing{ background:var(--teal-light); color:var(--teal);}
  .pill.past{ background:#EDEAE0; color:var(--ink-faint);}
  .stamp{ width:44px; height:44px; border-radius:50%; border:1.5px solid var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-weight:600; font-size:14px; position:relative; flex-shrink:0; color:var(--ink); transform:rotate(-3deg);}
  .stamp::after{ content:""; position:absolute; inset:3px; border:1px solid var(--ink); opacity:.35; border-radius:50%;}
  .stamp.lg{ width:60px; height:60px; font-size:19px;}
  .score-badge{ font-family:'Fraunces'; font-weight:600; font-size:12.5px; border:1.5px solid var(--teal); color:var(--teal); border-radius:999px; padding:5px 12px; display:inline-flex; align-items:center; gap:6px; flex-shrink:0;}
  .score-badge.lg{ font-size:16px; padding:8px 16px;}
  .score-badge .pct{ font-size:10px; opacity:.75; font-weight:700;}
  .donut-wrap{ display:flex; align-items:center; gap:20px; padding:18px 16px;}
  .donut{ width:120px; height:120px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; position:relative;}
  .donut::after{ content:""; position:absolute; inset:16px; background:var(--paper-card); border-radius:50%; display:flex;}
  .donut-center{ position:relative; z-index:2; text-align:center;}
  .donut-center .n{ font-family:'Fraunces'; font-weight:600; font-size:19px;}
  .donut-center .l{ font-size:8.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .legend{ display:flex; flex-direction:column; gap:8px;}
  .legend-row{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--ink-soft);}
  .legend-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .legend-row b{ color:var(--ink); margin-left:auto; font-weight:700;}
  .bar-row{ margin-bottom:13px;}
  .bar-row .top{ display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; margin-bottom:6px;}
  .bar-row .top span:last-child{ color:var(--ink-soft); font-weight:700;}
  .bar-track{ height:7px; background:var(--rule); border-radius:99px; overflow:hidden;}
  .bar-fill{ height:100%; border-radius:99px;}
  .chart-card{ padding:16px 14px 4px;}
  .chart-labels{ display:flex; justify-content:space-between; padding:2px 14px 12px; font-size:10px; font-weight:700; color:var(--ink-faint);}
  .search-bar{ display:flex; align-items:center; gap:8px; background:var(--paper-card); border:1px solid var(--rule); border-radius:12px; padding:10px 14px;}
  .search-bar input{ border:none; outline:none; background:none; font-size:12px; color:var(--ink); font-family:'Inter'; font-weight:500; flex:1;}
  .student-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--rule); cursor:pointer;}
  .student-row:last-child{ border-bottom:none;}
  .student-row .info{ flex:1; min-width:0;}
  .student-row .nm{ font-weight:700; font-size:13px;}
  .student-row .sc{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; font-weight:600;}
  .rank-badge{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-weight:700; font-size:11px; border:1.3px solid var(--ink-faint); color:var(--ink-soft); flex-shrink:0;}
  .rank-badge.top{ background:var(--gold); color:#fff; border-color:var(--gold);}
  .exam-tag{ font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px;}
  .podium{ display:flex; align-items:flex-end; gap:8px; padding:6px 4px 4px;}
  .podium-col{ flex:1; display:flex; flex-direction:column; align-items:center; min-width:0;}
  .podium-col .pname{ font-size:10.5px; font-weight:700; text-align:center; max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .podium-col .ppct{ font-size:10px; color:var(--ink-soft); font-weight:700; margin:2px 0 7px;}
  .podium-block{ width:100%; border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-family:'Fraunces'; font-weight:700; font-size:15px; color:#fff;}
  .mini-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .mini-stat{ background:var(--paper-card); border:1px solid var(--rule); border-radius:12px; padding:10px 6px; text-align:center;}
  .mini-stat .n{ font-family:'Fraunces'; font-weight:600; font-size:16px;}
  .mini-stat .l{ font-size:8.5px; color:var(--ink-soft); font-weight:700; margin-top:3px;}
  .field-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; display:block;}
  textarea.field, input.field, select.field{ width:100%; background:var(--paper-card); border:1px solid var(--rule); border-radius:12px; padding:12px; font-family:'Inter'; font-size:12px; color:var(--ink); resize:none; line-height:1.5; outline:none;}
  textarea.field:focus, input.field:focus, select.field:focus{ border-color:var(--teal);}
  .field-row{ display:flex; gap:10px;}
  .field-row .col{ flex:1; min-width:0;}
  .chip{ display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700; padding:6px 10px 6px 12px; border-radius:999px; margin:0 6px 8px 0;}
  .chip.good{ background:var(--teal-light); color:var(--teal);}
  .chip.bad{ background:var(--coral-light); color:var(--coral);}
  .chip span{ cursor:pointer; opacity:.7;}
  .chip-add-row{ display:flex; gap:8px; margin-top:2px;}
  .chip-add-row input{ flex:1; background:var(--paper-card); border:1px dashed var(--rule); border-radius:10px; padding:9px 12px; font-size:11.5px; outline:none; font-family:'Inter';}
  .chip-add-row input:focus{ border-color:var(--teal);}
  .chip-add-btn{ width:36px; border-radius:10px; background:var(--ink); color:var(--paper); border:none; cursor:pointer; font-size:16px; font-weight:700;}
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--rule);}
  .toggle-row:last-child{ border-bottom:none;}
  .toggle-row .tl{ font-weight:700; font-size:12.5px;}
  .toggle-row .ts{ font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .toggle{ width:40px; height:23px; border-radius:99px; background:var(--rule); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s;}
  .toggle.on{ background:var(--teal);}
  .toggle .knob{ width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:2.5px; left:3px; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .toggle.on .knob{ left:19px;}
  .wizard-steps{ display:flex; align-items:center; padding:6px 20px 18px;}
  .wstep{ display:flex; align-items:center; flex:1;}
  .wcircle{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fraunces'; font-weight:700; font-size:11px; border:1.5px solid var(--rule); color:var(--ink-faint); background:var(--paper-card); flex-shrink:0;}
  .wcircle.active{ border-color:var(--ink); color:var(--ink); background:var(--ink); color:var(--paper);}
  .wcircle.done{ border-color:var(--teal); background:var(--teal); color:#fff;}
  .wline{ height:1.5px; background:var(--rule); flex:1; margin:0 4px;}
  .wline.done{ background:var(--teal);}
  .wlabel{ font-size:8.5px; font-weight:700; color:var(--ink-faint); text-align:center; margin-top:5px;}
  .qitem{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--rule);}
  .qitem:last-child{ border-bottom:none;}
  .qitem .qi-text{ flex:1; font-size:12px; font-weight:600; line-height:1.4;}
  .qitem .qi-marks{ font-size:10px; color:var(--ink-soft); font-weight:700; margin-top:3px;}
  .qitem .qi-remove{ color:var(--coral); cursor:pointer; font-size:14px; padding:2px 4px;}
  .summary-row{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--rule); font-size:12px;}
  .summary-row:last-child{ border-bottom:none;}
  .summary-row .k{ color:var(--ink-soft); font-weight:600;}
  .summary-row .v{ font-weight:700;}
  .rec-item{ padding:14px 16px; border-bottom:1px solid var(--rule);}
  .rec-item:last-child{ border-bottom:none;}
  .rec-item .rdate{ font-size:10.5px; color:var(--ink-faint); font-weight:700; margin-bottom:6px; display:flex; justify-content:space-between;}
  .rec-item .rbody{ font-size:12px; line-height:1.5; color:var(--ink);}
  .rec-item .rtag{ font-size:10px; font-weight:700; color:var(--ink-soft); margin-top:6px;}
  .toast{ position:absolute; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--ink); color:var(--paper); font-size:12px; font-weight:600; padding:11px 18px; border-radius:11px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:50; white-space:nowrap; box-shadow:0 8px 20px rgba(0,0,0,.25);}
  .toast.show{ opacity:1; transform:translate(-50%,0);}
  .qmark{ width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .qmark.ok{ background:var(--teal-light); color:var(--teal);}
  .qmark.no{ background:var(--coral-light); color:var(--coral);}
  @media (max-width:380px){ .phone{ width:96vw;} }

/* ================================================================
   Responsive application shell
   Mobile keeps the original phone UI. At laptop widths the same screens
   become a real desktop SaaS workspace without changing the app logic.
   ================================================================ */
@media (min-width: 900px){
  body{ padding:0; background:#EDE6D6; }
  .intro{ display:none; }
  .stage{ width:100%; min-height:100vh; }
  .phone{ width:100%; max-width:none; padding:0; border-radius:0; background:var(--paper); box-shadow:none; }
  .phone-screen{ width:100%; height:100vh; min-height:100vh; border-radius:0; overflow:hidden; background:var(--paper);
    display:grid; grid-template-columns:240px minmax(0,1fr); grid-template-rows:74px minmax(0,1fr); }
  .notch,.status-row{ display:none; }

  /* Auth is deliberately centered instead of showing an empty sidebar. */
  .phone-screen.screen-login{ display:flex; align-items:center; justify-content:center; padding:40px; }
  .screen-login #app{ width:min(460px,100%); flex:0 0 auto !important; overflow:visible !important; }
  .screen-login #header-area,.screen-login #nav-area{ display:none; }
  .screen-login .scroll-area{ overflow:visible; padding:0; }
  .screen-login .auth-wrap{ width:100%; max-width:460px; margin:0 auto; padding:34px; background:var(--paper-card); border:1px solid var(--rule); border-radius:22px; box-shadow:var(--shadow); }
  .screen-login .auth-mark{ font-size:32px; }

  /* Desktop navigation becomes a proper SaaS sidebar. */
  .screen-app #nav-area{ grid-column:1; grid-row:1 / 3; min-width:0; display:flex; flex-direction:column; justify-content:flex-start; align-items:stretch;
    padding:24px 14px; background:var(--paper-card); border-right:1px solid var(--rule); gap:6px; }
  .screen-app #nav-area::before{ content:'Apni Vidya'; display:block; font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--ink); padding:4px 12px 24px; }
  .screen-app .bottom-nav{ border-top:0; padding:0; background:transparent; gap:4px; }
  .screen-app .nav-item{ width:100%; flex-direction:row; justify-content:flex-start; gap:12px; padding:12px 13px; border-radius:11px; }
  .screen-app .nav-item span{ font-size:12px; }
  .screen-app .nav-item.active{ background:var(--teal-light); }

  /* Desktop top bar. */
  .screen-app #header-area{ grid-column:2; grid-row:1; min-width:0; background:rgba(255,253,248,.96); border-bottom:1px solid var(--rule); }
  .screen-app .app-header{ height:74px; padding:0 32px; }
  .screen-app .app-header.simple{ height:74px; padding:0 32px; }
  .screen-app .header-title{ font-size:24px; }
  .screen-app .greet-eyebrow{ font-size:12px; }
  .screen-app .greet-name{ font-size:24px; }
  .screen-app .greet-sub{ font-size:12px; }

  /* Main workspace. Existing mobile cards/components remain intact, but
     get roomier spacing and sensible desktop widths. */
  .screen-app #app{ grid-column:2; grid-row:2; min-width:0; min-height:0; overflow:hidden !important; }

/* ========================================================================
   Apni Vidya Eval — Reference UI refresh
   Clean blue SaaS visual language inspired by the supplied mentor dashboard
   reference. Logic and API behavior remain unchanged.
   ======================================================================== */
:root{
  --paper:#F7F9FC;
  --paper-card:#FFFFFF;
  --ink:#17233D;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;

  --blue:#3156D8;
  --blue-dark:#2447C6;
  --blue-light:#EEF2FF;
  --teal:#159A75;
  --teal-light:#E8F7F1;
  --gold:#D49A19;
  --amber:#E89B28;
  --amber-light:#FFF5DF;
  --coral:#D84C5B;
  --coral-light:#FDECEF;
  --purple:#7A5AF8;
  --purple-light:#F1EEFF;
  --shadow:0 8px 24px rgba(31,45,78,.06),0 1px 3px rgba(31,45,78,.05);
}
body{background:#EEF2F7;color:var(--ink);}
.card,.stat-card,.quick-item,.dashboard-stat{box-shadow:0 1px 2px rgba(16,24,40,.03),0 7px 20px rgba(16,24,40,.045);border-color:#E7EBF1;}
.btn{background:var(--blue);border-radius:10px;box-shadow:0 4px 10px rgba(49,86,216,.16);}
.btn:hover{background:var(--blue-dark);}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none;}
.section-title{font-family:'Inter',sans-serif;font-size:14px;letter-spacing:-.01em;}
.section-title .link,.link-btn{color:var(--blue);}
.pill.upcoming{background:#FFF2DD;color:#B96E08;}
.pill.ongoing{background:var(--teal-light);color:var(--teal);}
.pill.past{background:#F2F4F7;color:#667085;}
.uline-tabs .t.active::after{background:var(--blue);}
.uline-tabs .t.active{color:var(--blue);}
.field:focus,textarea.field:focus,input.field:focus,select.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}

/* Dashboard reference composition */
.dashboard-welcome-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;max-width:1180px;margin:0 auto 22px;}
.page-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue);font-weight:800;margin-bottom:5px;}
.dashboard-welcome-row h1{font-size:27px;letter-spacing:-.03em;margin-bottom:5px;}
.dashboard-welcome-row p{font-size:12px;color:var(--ink-soft);}
.primary-action{padding:12px 17px;white-space:nowrap;}
.dashboard-stat-grid{max-width:1180px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.dashboard-stat{background:#fff;border:1px solid var(--rule);border-radius:15px;padding:17px;display:flex;align-items:flex-start;gap:12px;min-width:0;}
.dashboard-stat .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;}
.stat-icon.blue{background:var(--blue-light);color:var(--blue)} .stat-icon.purple{background:var(--purple-light);color:var(--purple)} .stat-icon.green{background:var(--teal-light);color:var(--teal)} .stat-icon.orange{background:#FFF2E5;color:#D87B18}
.dashboard-stat span{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-bottom:5px;}
.dashboard-stat strong{display:block;font-family:'Inter',sans-serif;font-size:23px;letter-spacing:-.03em;line-height:1.05;}
.dashboard-stat small{display:block;font-size:9.5px;color:var(--ink-faint);margin-top:5px;}
.dashboard-main-grid{max-width:1180px;margin:0 auto 22px;display:grid;grid-template-columns:1.55fr 1fr;gap:16px;}
.dashboard-chart-card,.dashboard-topics-card{padding:18px 20px;min-height:230px;}
.dash-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
.dash-card-head b{display:block;font-size:13px;}
.dash-card-head span{display:block;font-size:10px;color:var(--ink-faint);margin-top:4px;}
.link-btn{background:none;border:0;font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap;}
.chart-empty{height:150px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;text-align:center;}

.alert-card{max-width:1180px;margin:0 auto 16px;background:#FFF9ED;border:1px solid #F5DFAF;border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.alert-icon{width:27px;height:27px;border-radius:8px;background:#FFE8B6;color:#B96E08;display:flex;align-items:center;justify-content:center;font-weight:800;}
.alert-card b{display:block;font-size:11.5px}.alert-card span{display:block;font-size:10px;color:#8A6A2A;margin-top:3px}.alert-arrow{margin-left:auto;font-size:20px;color:#B96E08!important;}
.recent-tests-card{overflow:hidden;}
.recent-test-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s;}
.recent-test-row:last-child{border-bottom:0}.recent-test-row:hover{background:#FAFBFD;}
.recent-test-icon{width:34px;height:34px;border-radius:9px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.recent-test-copy{flex:1;min-width:0}.recent-test-copy b{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.recent-test-copy span{display:block;font-size:9.5px;color:var(--ink-faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.recent-test-meta{text-align:right;min-width:92px}.recent-test-meta strong{display:block;font-size:10px}.recent-test-meta span{display:block;font-size:9px;color:var(--ink-faint);margin-top:3px;}

.dashboard-section{max-width:1180px;margin-left:auto;margin-right:auto;}
.quick-item{transition:transform .12s,box-shadow .12s}.quick-item:hover{transform:translateY(-1px);}

<script>
// Real clock in the status bar — the app is live, so a frozen 9:41 would be
// the one dishonest pixel on the screen.
function tickStatusClock() {
  document.getElementById('statusclock').textContent =
    new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
tickStatusClock();
setInterval(tickStatusClock, 20000);
</script>

/* ---------------------------------------------------------------- API --- */

const API = {
  token: localStorage.getItem('av_token') || null,
  user: JSON.parse(localStorage.getItem('av_user') || 'null'),

  async call(path, { method = 'GET', body } = {}) {
    const res = await fetch('/api' + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(this.token ? { Authorization: 'Bearer ' + this.token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });

    // An expired or tampered token drops the session rather than leaving the
    // app in a half-authenticated state showing stale screens.
    if (res.status === 401 && this.token) {
      this.clear();
      state.screen = 'login';
      render();
      throw new Error('Your session expired — sign in again');
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Something went wrong'), { status: res.status, data });
    return data;
  },

  get(p) { return this.call(p); },
  post(p, body) { return this.call(p, { method: 'POST', body }); },
  put(p, body) { return this.call(p, { method: 'PUT', body }); },
  patch(p, body) { return this.call(p, { method: 'PATCH', body }); },
  del(p) { return this.call(p, { method: 'DELETE' }); },

  async upload(p, formData) {
    const res = await fetch('/api' + p, {
      method: 'POST',
      headers: this.token ? { Authorization: 'Bearer ' + this.token } : {},
      body: formData,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || 'Upload failed'), { status: res.status, data });
    return data;
  },

  save(token, user) {
    this.token = token; this.user = user;
    localStorage.setItem('av_token', token);
    localStorage.setItem('av_user', JSON.stringify(user));
  },
  clear() {
    this.token = null; this.user = null;
    localStorage.removeItem('av_token');
    localStorage.removeItem('av_user');
  },
};

// User-entered text goes through here before it reaches innerHTML. Question
// text, student names and mentor feedback are all free text, so escaping is
// not optional.
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const initials = (name) => String(name || '').trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: true });
}
function clock(sec) {
  const s = Math.max(0, Math.floor(sec));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
}
function mins(sec) {
  const m = Math.round((sec || 0) / 60);
  return m < 1 ? '<1m' : m + 'm';
}
const bandColor = (b) => b === 'strong' ? 'var(--teal)' : b === 'moderate' ? 'var(--amber)' : 'var(--coral)';
const pctColor = (p) => p >= 80 ? 'var(--teal)' : p >= 60 ? 'var(--gold)' : p >= 40 ? 'var(--amber)' : 'var(--coral)';

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

function bar(label, value, color, suffix = '%') {
  return `<div class="bar-row"><div class="top"><span>${esc(label)}</span><span>${value}${suffix}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, Math.min(100, value))}%;background:${color};"></div></div></div>`;
}

function statCard(label, value, color) {
  return `<div class="stat-card"><div class="stat-label" style="margin-bottom:8px;">${esc(label)}</div>
    <div class="stat-num"${color ? ` style="color:${color};"` : ''}>${value}</div></div>`;
}

// A line chart drawn straight from the trend data, rather than the fixed
// polyline the prototype used.
function sparkline(points, labels) {
  if (points.length < 2) {
    return `<div class="empty" style="padding:22px 8px;">Not enough exams yet to draw a trend.</div>`;
  }
  const W = 300, H = 100, pad = 20;
  const max = Math.max(100, ...points), min = Math.min(0, ...points);
  const x = (i) => pad + (i * (W - pad * 2)) / (points.length - 1);
  const y = (v) => H - 12 - ((v - min) / (max - min || 1)) * (H - 30);
  const path = points.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <polygon points="${path} ${x(points.length - 1).toFixed(1)},${H - 6} ${pad},${H - 6}" fill="url(#fillg)"/>
    <defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E6E5C" stop-opacity="0.26"/><stop offset="100%" stop-color="#0E6E5C" stop-opacity="0"/>
    </linearGradient></defs>
    <polyline points="${path}" fill="none" stroke="#0E6E5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${points.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i === points.length - 1 ? 4.5 : 3.5}" fill="${i === points.length - 1 ? '#B8483C' : '#0E6E5C'}"/>`).join('')}
  </svg>
  <div class="chart-labels">${labels.map((l) => `<span>${esc(l)}</span>`).join('')}</div>`;
}

const ROOTS_ADMIN = ['dashboard', 'batches', 'tests', 'students', 'profile'];
const ROOTS_STUDENT = ['sDashboard', 'sExams', 'sResults', 'sLeaderboard', 'sProfile'];
const currentRoots = () => (isAdmin() ? ROOTS_ADMIN : ROOTS_STUDENT);

function sectionOf(sc) {
  const map = {
    dashboard: 'dashboard', batches: 'batches', tests: 'tests', testDetail: 'tests', createTest: 'tests', grading: 'tests',
    analytics: 'analytics', students: 'students', studentDetail: 'students',
    recommendation: 'students', recHistory: 'students', profile: 'profile',
    sDashboard: 'sDashboard', sExams: 'sExams', sJoin: 'sExams', sBriefing: 'sExams', sPlayer: 'sExams',
    sResults: 'sResults', sReport: 'sResults', sLeaderboard: 'sLeaderboard', sProfile: 'sProfile',
  };
  return map[sc];
}

// Every navigation goes through go(): it sets the screen, runs that screen's
// loader, and re-renders. Screens therefore never fetch during render.
async function go(screen, extra = {}, { push = true } = {}) {
  if (push && state.screen !== screen) state.stack.push(state.screen);
  Object.assign(state, extra);
  state.screen = screen;
  state.error = null;
  await load();
}

async function goRoot(screen) {
  state.stack = [];
  await go(screen, {}, { push: false });
}

async function goBack() {
  const prev = state.stack.pop();
  state.screen = prev || (isAdmin() ? 'dashboard' : 'sDashboard');
  await load();
}

function headerBack() {
  if (state.screen === 'createTest' && state.createStep > 1) {
    state.createStep -= 1;
    render();
    return;
  }
  goBack();
}

// Loads whatever the current screen needs, then renders. A failure renders the
// message in place instead of leaving a blank screen.
async function load() {
  const loader = LOADERS[state.screen];
  if (!loader) { render(); return; }

  state.loading = true;
  state.data = {};
  render();

  try {
    state.data = (await loader()) || {};
    state.error = null;
  } catch (err) {
    state.error = err.message;
  } finally {
    state.loading = false;
    render();
  }
}

function render() {
  document.querySelector('.notification-layer')?.remove();
  const app = document.getElementById('app');
  const shell = document.querySelector('.phone-screen');
  if (shell) shell.classList.remove('screen-login', 'screen-app', 'screen-player');

  if (!API.token || state.screen === 'login') {
    if (shell) shell.classList.add('screen-login');
    app.innerHTML = `<div class="scroll-area">${loginScreen()}</div>`;
    document.getElementById('header-area').innerHTML = '';
    document.getElementById('nav-area').innerHTML = '';
    return;
  }

  // The exam player takes over the whole frame: no bottom nav, no back
  // button. Leaving mid-paper should be a decision, not a stray tap.
  if (state.screen === 'sPlayer') {
    if (shell) shell.classList.add('screen-player');
    document.getElementById('header-area').innerHTML = '';
    document.getElementById('nav-area').innerHTML = '';
    app.innerHTML = playerScreen();
    return;
  }

  if (shell) shell.classList.add('screen-app');
  document.getElementById('header-area').innerHTML = getHeader();
  app.innerHTML = `<div class="scroll-area" id="scroll">${getContent()}</div>`;
  document.getElementById('nav-area').innerHTML = getNav();
}

    <span class="nav-profile-arrow">›</span>
  </div>`;
}

function getNotifications() {
  const notes = [];
  const exams = state.data?.exams || [];
  const perf = state.data?.perf;

  const live = exams.filter((e) => e.live_status === 'Ongoing').slice(0, 2);
  live.forEach((e) => notes.push({
    id: `live-${e.id}`,
    type: 'live',
    title: 'Exam is live now',
    body: `${e.title} is available to attempt.`,
    action: () => startExam(e.id),
  }));

  const upcoming = exams.filter((e) => e.live_status === 'Upcoming').slice(0, 2);
  upcoming.forEach((e) => notes.push({
    id: `upcoming-${e.id}`,
    type: 'upcoming',
    title: 'Upcoming exam',
    body: `${e.title} · ${fmtDate(e.scheduled_at)} at ${fmtTime(e.scheduled_at)}.`,
    action: () => goRoot(isAdmin() ? 'tests' : 'sExams'),
  }));

  if (!isAdmin() && perf?.history?.exams?.length) {
    const latest = perf.history.exams[perf.history.exams.length - 1];
    notes.push({
      id: `result-${latest.attempt_id || latest.exam_id || latest.title}`,
      type: 'result',
      title: 'Latest result is ready',
      body: `${latest.title} · ${latest.percentage}% score.`,
      action: () => latest.attempt_id ? go('sReport', { selectedAttemptId: latest.attempt_id }) : goRoot('sResults'),
    });
  }

  if (!isAdmin() && perf?.weak_topics?.length) {
    const t = perf.weak_topics[0];
    notes.push({
      id: `topic-${t.topic}`,
      type: 'study',
      title: 'Study suggestion',
      body: `${t.topic} is currently at ${t.accuracy}%. A little extra practice could help.`,
      action: () => goRoot('sResults'),
    });
  }

  return notes;
}

function notificationUnreadCount() {
  const read = JSON.parse(localStorage.getItem('av_notification_read') || '[]');
  return getNotifications().filter((n) => !read.includes(n.id)).length;
}

function toggleNotifications(event) {
  event?.stopPropagation();
  const existing = document.querySelector('.notification-layer');
  if (existing) { existing.remove(); return; }

  const notes = getNotifications();
  const read = JSON.parse(localStorage.getItem('av_notification_read') || '[]');
  const panel = document.createElement('div');
  panel.className = 'notification-layer';
  panel.innerHTML = `<div class="notification-backdrop" onclick="closeNotifications(event)"></div>
    <div class="notification-panel" role="dialog" aria-label="Notifications">
      <div class="notification-head"><div><b>Notifications</b><span>${notes.length ? `${notes.length} updates` : 'You are all caught up'}</span></div>
        <button type="button" onclick="markNotificationsRead(event)">Mark all read</button></div>
      <div class="notification-list">
        ${notes.length ? notes.map((n) => `<button type="button" class="notification-item ${read.includes(n.id) ? '' : 'unread'}" onclick="handleNotification('${esc(n.id)}')">
          <span class="notification-icon ${n.type}">${n.type === 'live' ? '▶' : n.type === 'result' ? '✓' : n.type === 'study' ? '✦' : '◷'}</span>
          <span class="notification-copy"><b>${esc(n.title)}</b><small>${esc(n.body)}</small></span>
          ${read.includes(n.id) ? '' : '<i></i>'}
        </button>`).join('') : `<div class="notification-empty">No new notifications right now.</div>`}
      </div>
    </div>`;
  document.querySelector('.phone-screen')?.appendChild(panel);
}

function closeNotifications(event) {
  event?.stopPropagation();
  document.querySelector('.notification-layer')?.remove();
}

function handleNotification(id) {
  const notes = getNotifications();
  const n = notes.find((x) => x.id === id);
  const read = JSON.parse(localStorage.getItem('av_notification_read') || '[]');
  if (!read.includes(id)) read.push(id);
  localStorage.setItem('av_notification_read', JSON.stringify(read));
  document.querySelector('.notification-layer')?.remove();
  if (n?.action) n.action();
}

function markNotificationsRead(event) {
  event?.stopPropagation();
  const read = JSON.parse(localStorage.getItem('av_notification_read') || '[]');
  getNotifications().forEach((n) => { if (!read.includes(n.id)) read.push(n.id); });
  localStorage.setItem('av_notification_read', JSON.stringify(read));
  document.querySelector('.notification-layer')?.remove();
  render();
}

    </div>
    <button class="btn full" onclick="doLogin()">Sign in</button>
    <div class="auth-hint">
      <b>Demo accounts.</b> Admin: admin@apnividya.in / mentor123.<br>
      Student: student@apnividya.in / student123.
    </div>
  </div>`;
}

function setAuthMode(m) { state.authMode = m; state.authError = null; render(); }

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pw').value;
  if (!email || !password) { state.authError = 'Enter your email and password.'; render(); return; }

  try {
    const res = await API.post('/auth/login', { email, password });
    API.save(res.token, res.user);
    state.authError = null;
    state.stack = [];
    await go(res.user.role === 'admin' ? 'dashboard' : 'sDashboard', {}, { push: false });
  } catch (err) {
    state.authError = err.message;
    render();
  }
}

function logout() {
  if (state.ticker) clearInterval(state.ticker);
  API.clear();
  Object.assign(state, { screen: 'login', stack: [], data: {}, exam: null, answers: {} });
  render();
}

function detailBody(exam, an) {
  const appeared = an ? an.summary.appeared : 0;

  if (state.overviewTab === 'Overview') {
    if (!appeared) {
      return `<div class="section"><div class="card empty"><b>Not yet conducted</b>

    }
    const s = an.summary;
    return `
    <div class="section">
      <div class="stat-grid">
        ${statCard('Students appeared', `${s.appeared}<span style="font-size:13px;color:var(--ink-faint);">/${s.total_students}</span>`)}
        ${statCard('Batch average', s.class_average_pct + '%', 'var(--teal)')}
        ${statCard('Highest score', `${s.highest_score}<span style="font-size:13px;color:var(--ink-faint);">/${s.total_marks}</span>`)}
        ${statCard('Lowest score', `${s.lowest_score}<span style="font-size:13px;color:var(--ink-faint);">/${s.total_marks}</span>`)}
        ${statCard('Pass percentage', s.pass_pct + '%', 'var(--teal)')}
        ${statCard('Fail percentage', s.fail_pct + '%', 'var(--coral)')}
      </div>
    </div>
    ${distributionCard(an)}
    ${an.leaderboard.length ? `<div class="section">
      <div class="section-title">Results</div>
      <div class="card" style="padding:4px 14px;">
        ${an.leaderboard.map((r) => `<div class="student-row" onclick="go('studentDetail',{selectedStudentId:${r.student_id},studentTab:'Overview'})">
          <div class="rank-badge ${r.rank === 1 ? 'top' : ''}">${r.rank}</div>
          <div class="stamp" style="width:36px;height:36px;font-size:11px;">${initials(r.name)}</div>
          <div class="info"><div class="nm">${esc(r.name)}</div>
            <div class="sc">${esc(r.roll_no || '')} · ${r.score}/${r.max_marks}${r.passed === 0 ? ' · Failed' : ''}</div></div>
          <span class="score-badge" style="border-color:${pctColor(r.percentage)};color:${pctColor(r.percentage)};font-size:11px;padding:4px 9px;">${r.percentage}%</span>
        </div>`).join('')}
      </div>
    </div>` : ''}
    ${exam.questions.some((q) => q.type === 'descriptive') ? `<div class="section">
      <button class="btn ghost full" onclick="go('grading',{selectedExamId:${exam.id}})">Grade descriptive answers →</button>
    </div>` : ''}`;
  }

  if (state.overviewTab === 'Performance') {
    if (!appeared) return `<div class="section"><div class="card empty"><b>Nothing to analyse yet</b>Topic performance needs at least one submission.</div></div>`;
    const strong = an.topics.filter((t) => t.band === 'strong');
    const weak = an.topics.filter((t) => t.band !== 'strong');
    const worst = [...an.questions].filter((q) => q.attempts > 0).sort((a, b) => a.accuracy - b.accuracy).slice(0, 4);

    return `
    ${strong.length ? `<div class="section"><div class="section-title">Strong topics</div>
      <div class="card" style="padding:16px;">${strong.map((t) => bar(t.topic, t.accuracy, 'var(--teal)')).join('')}</div></div>` : ''}
    ${weak.length ? `<div class="section"><div class="section-title">Weak topics</div>
      <div class="card" style="padding:16px;">${weak.map((t) => bar(t.topic, t.accuracy, bandColor(t.band))).join('')}</div></div>` : ''}
    <div class="section"><div class="section-title">Most incorrect questions</div>
      <div class="card" style="padding:6px 16px;">
        ${worst.map((q) => `<div class="qitem"><div class="qi-text">Q${q.position + 1}. ${esc(q.text)}
          <div class="qi-marks">${esc(q.topic || '')} · ${q.correct}/${q.attempts} got this right · ${q.accuracy}%</div></div></div>`).join('')}
      </div></div>
    <div class="section"><div class="section-title">By question difficulty</div>
      <div class="card" style="padding:16px;">
        ${an.difficulty.map((d) => bar(
          d.difficulty[0].toUpperCase() + d.difficulty.slice(1) + ` (${d.questions} Qs)`,
          d.accuracy, pctColor(d.accuracy))).join('')}
      </div>
      <div class="auth-hint" style="padding:0 2px;">Accuracy on questions you tagged at each level. A low figure on “easy” usually points at a gap earlier in the syllabus.</div>
    </div>`;
  }

  if (state.overviewTab === 'Flags') {
    const flags = state.data.violations || [];
    if (!flags.length) {
      return `<div class="section"><div class="card empty"><b>No violations recorded</b>
        Nobody left the exam tab during this paper.</div></div>`;
    }
    return `<div class="section">
      <div class="auth-hint" style="padding:0 2px 10px;">
        Proctoring records when a student leaves the exam surface. It cannot see the room,
        a second device, or another person — treat these as prompts to ask, not as proof.
      </div>
      <div class="card" style="padding:4px 16px;">
        ${flags.map((f) => `<div class="vio-row">
          <div class="vio-count">${f.violations}</div>
          <div class="stamp" style="width:34px;height:34px;font-size:10px;">${initials(f.name)}</div>
          <div style="flex:1;min-width:0;">
            <div class="nm" style="font-weight:700;font-size:12.5px;">${esc(f.name)}
              ${f.terminated ? '<span class="proctor-chip" style="margin-left:5px;">Terminated</span>' : ''}</div>
            <div class="vio-ev">${esc(f.roll_no || '')} · ${f.events.slice(0, 3).map((e) =>
              `${esc(e.label)} at ${fmtTime(e.occurred_at)}`).join(' · ')}${f.events.length > 3 ? ` · +${f.events.length - 3} more` : ''}</div>
          </div>
          <span class="score-badge" style="font-size:11px;padding:4px 9px;">${f.percentage}%</span>
        </div>`).join('')}
      </div></div>`;
  }

  // Questions tab
  return `<div class="section"><div class="card" style="padding:6px 16px;">
    ${exam.questions.map((q, i) => {
      const stat = an && an.questions.find((x) => x.question_id === q.id);
      return `<div class="qitem"><div class="qi-text">Q${i + 1}. ${esc(q.text)}
        <div class="qi-marks">${q.exam_marks} mark${q.exam_marks > 1 ? 's' : ''} · ${esc(q.type.toUpperCase())} · ${esc(q.topic || '—')} · ${esc(q.difficulty)}
        ${stat && stat.attempts ? ` · ${stat.accuracy}% correct` : ''}</div></div></div>`;
    }).join('')}
  </div></div>`;
}

function distributionCard(an) {
  const colors = ['var(--teal)', 'var(--gold)', 'var(--amber)', 'var(--burnt)', 'var(--coral)'];
  let acc = 0;
  const stops = an.distribution.map((d, i) => {
    const from = acc; acc += d.pct;
    return `${colors[i]} ${from}% ${acc}%`;
  }).join(', ');
  return `<div class="section"><div class="card">
    <div style="padding:16px 16px 4px;"><div class="section-title" style="margin-bottom:0;">Score distribution</div></div>
    <div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div class="donut-center"><div class="n">${an.summary.appeared}</div><div class="l">Appeared</div></div></div>
      <div class="legend">
        ${an.distribution.map((d, i) => `<div class="legend-row">
          <span class="legend-dot" style="background:${colors[i]}"></span>${d.label} <b>${d.count}</b></div>`).join('')}
      </div>
    </div></div></div>`;
}

      <div class="grade-who">
        <div class="stamp" style="width:34px;height:34px;font-size:10px;">${initials(g.student_name)}</div>
        <div><div class="nm">${esc(g.student_name)}</div><div class="rl">${esc(g.roll_no || '')}</div></div>
      </div>
      <div class="grade-q">Q${g.position + 1}. ${esc(g.text)}</div>
      <div class="grade-ans">${esc(g.answer || '(left blank)')}</div>
      ${g.model_answer ? `<div class="grade-model"><b>Marking note:</b> ${esc(g.model_answer)}</div>` : ''}
      <div class="mark-row">
        <input type="number" id="mark-${g.answer_id}" min="0" max="${g.max_marks}" step="0.5"
          value="${state.grading[g.answer_id] ?? ''}" placeholder="0"
          oninput="state.grading[${g.answer_id}]=this.value">
        <span class="of">/ ${g.max_marks} marks</span>
        <button class="btn sm" style="margin-left:auto;" onclick="gradeOne(${g.answer_id},${g.max_marks})">Save</button>
      </div>
    </div>`).join('')}
  </div>
  <div class="section"><button class="btn full" onclick="gradeAll()">Save all marks</button></div>`;
};

async function gradeOne(answerId, max) {
  const raw = document.getElementById('mark-' + answerId).value;
  const marks = Number(raw);
  if (raw === '' || Number.isNaN(marks)) { showToast('Enter a mark first'); return; }
  if (marks < 0 || marks > max) { showToast(`Marks must be between 0 and ${max}`); return; }
  try {
    await API.post('/attempts/grade', { grades: [{ answer_id: answerId, marks }] });
    delete state.grading[answerId];
    showToast('Marked');
    await load();
  } catch (err) { showToast(err.message); }
}

async function gradeAll() {
  const grades = Object.entries(state.grading)
    .filter(([, v]) => v !== '' && !Number.isNaN(Number(v)))
    .map(([answer_id, marks]) => ({ answer_id: Number(answer_id), marks: Number(marks) }));
  if (!grades.length) { showToast('Enter some marks first'); return; }
  try {
    const res = await API.post('/attempts/grade', { grades });
    state.grading = {};
    showToast(`Marked ${res.graded} answer${res.graded > 1 ? 's' : ''}`);
    await load();
  } catch (err) { showToast(err.message); }
}

function openCreateTest() {
  state.createStep = 1;
  state.bankSelected = [];
  state.questionSource = 'new';
  state.draft = {
    batch_id: null, title: '', subject: '',
    date: new Date(Date.now() + 86400000).toISOString().slice(0, 10),
    time: '10:00', duration_min: 60, passing_marks: '', question_type: 'mixed',
    instructions: 'Answer all questions. Your answers save automatically and the paper submits itself when the timer ends.',
    newQuestions: [],
    settings: { shuffle: false, show_result: true, negative_marking: false,
                proctoring: false, max_violations: 3 },
  };
  go('createTest');
}

SCREENS.createTest = () => {
  const steps = [{ n: 1, l: 'Details' }, { n: 2, l: 'Questions' }, { n: 3, l: 'Settings' }, { n: 4, l: 'Publish' }];
  const head = steps.map((st, i) => `<div class="wstep">
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div class="wcircle ${st.n < state.createStep ? 'done' : st.n === state.createStep ? 'active' : ''}">${st.n < state.createStep ? '✓' : st.n}</div>
      <div class="wlabel">${st.l}</div></div>
    ${i < steps.length - 1 ? `<div class="wline ${st.n < state.createStep ? 'done' : ''}"></div>` : ''}
  </div>`).join('');
  return `<div class="wizard-steps">${head}</div>${wizardBody()}`;
};

function wizardBody() {
  const d = state.draft;
  const { batches } = state.data;

  if (state.createStep === 1) {
    return `
    <div class="section"><span class="field-label">Test title</span>
      <input class="field" value="${esc(d.title)}" placeholder="e.g. Internal Assessment · Unit 1"

      <select class="field" onchange="state.draft.batch_id=Number(this.value)">
        <option value="">Choose a batch…</option>

    <div class="section"><span class="field-label">Subject</span>
      <input class="field" value="${esc(d.subject)}" placeholder="e.g. Machine Learning"

      <div class="col"><span class="field-label">Date</span>
        <input class="field" type="date" value="${d.date}" oninput="state.draft.date=this.value"></div>
      <div class="col"><span class="field-label">Start time</span>
        <input class="field" type="time" value="${d.time}" oninput="state.draft.time=this.value"></div>
    </div></div>
    <div class="section"><div class="field-row">
      <div class="col"><span class="field-label">Duration</span>
        <select class="field" onchange="state.draft.duration_min=Number(this.value)">

        </select></div>
      <div class="col"><span class="field-label">Passing marks</span>
        <input class="field" type="number" value="${d.passing_marks}" placeholder="Auto (33%)"
          oninput="state.draft.passing_marks=this.value"></div>
    </div></div>
    <div class="section"><span class="field-label">Instructions for students</span>
      <textarea class="field" rows="3" oninput="state.draft.instructions=this.value">${esc(d.instructions)}</textarea></div>
    <div class="section"><button class="btn full" onclick="wizardNext()">Next: Add questions →</button></div>`;
  }

  if (state.createStep === 2) {
    return `
    <div class="section">
      <div class="seg">
        <button class="${state.questionSource === 'new' ? 'on' : ''}" onclick="setSource('new')">✍ Write new</button>
        <button class="${state.questionSource === 'document' ? 'on' : ''}" onclick="setSource('document')">📄 Upload document</button>
      </div>
      ${state.questionSource === 'document' ? documentImportForm() : newQuestionForm()}
    </div>
    ${selectedList()}
    <div class="section" style="display:flex;gap:10px;">
      <button class="btn ghost" style="flex:1;justify-content:center;" onclick="wizardBack()">← Back</button>
      <button class="btn" style="flex:1;justify-content:center;" onclick="wizardNext()">Next: Settings →</button>
    </div>`;
  }

  if (state.createStep === 3) {
    const s = d.settings;
    return `
    <div class="section"><div class="card" style="padding:2px 16px;">
      ${toggleRow('shuffle', 'Shuffle questions', 'Each student gets the paper in a different order', s.shuffle)}
      ${toggleRow('show_result', 'Show result immediately', 'Students see their report the moment they submit', s.show_result)}
      ${toggleRow('negative_marking', 'Negative marking', 'Apply each question’s penalty to wrong answers', s.negative_marking)}
      ${toggleRow('proctoring', 'Proctoring', 'Record when a student leaves the exam tab', s.proctoring)}
    </div></div>
    ${s.proctoring ? `<div class="section">
      <span class="field-label">Submit the paper after</span>
      <select class="field" onchange="state.draft.settings.max_violations=Number(this.value)">
        <option value="1" ${s.max_violations === 1 ? 'selected' : ''}>1 violation — no warnings</option>
        <option value="2" ${s.max_violations === 2 ? 'selected' : ''}>2 violations — 1 warning</option>
        <option value="3" ${s.max_violations === 3 ? 'selected' : ''}>3 violations — 2 warnings</option>
        <option value="5" ${s.max_violations === 5 ? 'selected' : ''}>5 violations — 4 warnings</option>
      </select>
      <div class="auth-hint" style="padding:0 2px;">
        A notification popping up or an accidental Alt-Tab both register as violations.
        Allowing at least one warning is usually fairer than submitting on the first event.
      </div>
    </div>` : ''}
    <div class="section"><div class="auth-hint" style="padding:0 2px;">
      Unattempted questions never carry a penalty — only wrong answers do.
    </div></div>
    <div class="section" style="display:flex;gap:10px;">
      <button class="btn ghost" style="flex:1;justify-content:center;" onclick="wizardBack()">← Back</button>
      <button class="btn" style="flex:1;justify-content:center;" onclick="wizardNext()">Next: Publish →</button>
    </div>`;
  }

  const total = draftTotalMarks();
  const count = d.newQuestions.length;
  const batch = batches.find((b) => b.id === d.batch_id);
  return `
  <div class="section"><div class="card" style="padding:6px 16px;">
    ${row('Title', d.title || '—')}
    ${row('Batch', batch ? batch.name : '—')}
    ${row('Subject', d.subject)}
    ${row('Starts', `${fmtDate(d.date)}, ${d.time}`)}
    ${row('Duration', d.duration_min + ' minutes')}
    ${row('Questions', count)}
    ${row('Total marks', total)}
    ${row('Passing marks', d.passing_marks || Math.ceil(total * 0.4) + ' (auto)')}
    ${row('Shuffle', d.settings.shuffle ? 'On' : 'Off')}
    ${row('Instant results', d.settings.show_result ? 'On' : 'Off')}
    ${row('Negative marking', d.settings.negative_marking ? 'On' : 'Off')}
    ${row('Proctoring', d.settings.proctoring ? `On — submits after ${d.settings.max_violations}` : 'Off')}
  </div></div>
  <div class="section" style="display:flex;gap:10px;">
    <button class="btn ghost" style="flex:1;justify-content:center;" onclick="wizardBack()">← Back</button>
    <button class="btn" style="flex:1;justify-content:center;" onclick="publishDraft()">Publish Test</button>
  </div>`;
}

const row = (k, v) => `<div class="summary-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`;

function toggleRow(key, label, sub, on) {
  return `<div class="toggle-row"><div><div class="tl">${label}</div><div class="ts">${sub}</div></div>
    <div class="toggle ${on ? 'on' : ''}" onclick="toggleSetting('${key}')"><div class="knob"></div></div></div>`;
}
function toggleSetting(key) { state.draft.settings[key] = !state.draft.settings[key]; render(); }
function setSource(s) { state.questionSource = s; render(); }

function bankPicker(bank) {
  const f = state.bankFilter;
  const topics = [...new Set(bank.map((q) => q.topic).filter(Boolean))];
  const list = bank.filter((q) =>
    (!f.topic || q.topic === f.topic) && (!f.type || q.type === f.type));
  return `
  <div class="field-row" style="margin-bottom:10px;">
    <div class="col"><select class="field" onchange="setBankFilter('topic',this.value)">
      <option value="">All topics</option>
      ${topics.map((t) => `<option ${f.topic === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="col"><select class="field" onchange="setBankFilter('type',this.value)">
      <option value="">All types</option>
      ${['mcq', 'msq', 'numeric', 'descriptive'].map((t) => `<option value="${t}" ${f.type === t ? 'selected' : ''}>${t.toUpperCase()}</option>`).join('')}</select></div>
  </div>
  <div class="card" style="padding:4px 16px;max-height:260px;overflow-y:auto;">
    ${list.length ? list.map((q) => {
      const on = state.bankSelected.includes(q.id);
      return `<div class="bank-item" onclick="toggleBank(${q.id})">
        <div class="bank-check ${on ? 'on' : ''}">${on ? '✓' : ''}</div>
        <div class="bank-text">${esc(q.text)}
          <div class="bank-meta">${esc(q.topic || '—')} · ${esc(q.type)} · ${q.marks} mark${q.marks > 1 ? 's' : ''} · ${esc(q.difficulty)}</div></div>
      </div>`;
    }).join('') : `<div class="empty">No questions match those filters.</div>`}
  </div>`;
}

function setBankFilter(k, v) { state.bankFilter[k] = v; render(); }
function toggleBank(id) {
  const i = state.bankSelected.indexOf(id);
  if (i >= 0) state.bankSelected.splice(i, 1); else state.bankSelected.push(id);
  render();
}

function setPicker(sets) {
  if (!sets.length) return `<div class="card empty">You have not saved any question sets yet.</div>`;
  return `<div class="card" style="padding:4px 16px;">
    ${sets.map((s) => `<div class="bank-item" onclick="addSet(${s.id})">
      <div class="bank-check">+</div>
      <div class="bank-text">${esc(s.name)}<div class="bank-meta">${esc(s.subject || '')} · ${s.question_count} questions</div></div>
    </div>`).join('')}</div>`;
}

async function addSet(id) {
  try {
    const set = await API.get('/questions/sets/' + id);
    set.questions.forEach((q) => { if (!state.bankSelected.includes(q.id)) state.bankSelected.push(q.id); });
    showToast(`Added ${set.questions.length} questions`);
    render();
  } catch (err) { showToast(err.message); }
}

function newQuestionForm() {
  return `
  <div style="margin-bottom:10px;"><span class="field-label">Question</span>
    <textarea class="field" id="nq-text" rows="2" placeholder="Type the question…"></textarea></div>
  <div class="field-row" style="margin-bottom:10px;">
    <div class="col"><span class="field-label">Type</span>
      <select class="field" id="nq-type" onchange="render()">
        <option value="mcq">Multiple choice</option><option value="descriptive">Descriptive</option>
      </select></div>
    <div class="col"><span class="field-label">Topic</span>
      <input class="field" id="nq-topic" placeholder="e.g. Arrays"></div>
  </div>
  <div id="nq-options" style="margin-bottom:10px;">
    <span class="field-label">Options — tap the circle to mark the correct one</span>
    ${[0, 1, 2, 3].map((i) => `<div style="display:flex;gap:8px;align-items:center;margin-bottom:7px;">
      <div class="bank-check" id="nq-correct-${i}" onclick="setNewCorrect(${i})" style="border-radius:50%;cursor:pointer;"></div>
      <input class="field" id="nq-opt-${i}" placeholder="Option ${i + 1}" style="flex:1;"></div>`).join('')}
  </div>
  <div id="nq-model-answer" style="margin-bottom:10px;">
    <span class="field-label">Answer / marking guide</span>
    <textarea class="field" id="nq-answer" rows="2" placeholder="For descriptive questions, enter the expected answer…"></textarea>
  </div>
  <div class="field-row" style="margin-bottom:10px;">
    <div class="col"><span class="field-label">Marks</span>
      <select class="field" id="nq-marks">${[1, 2, 3, 4, 5].map((m) => `<option>${m}</option>`).join('')}</select></div>
    <div class="col"><span class="field-label">Difficulty</span>
      <select class="field" id="nq-diff"><option value="easy">Easy</option>
        <option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
  </div>
  <button class="btn full" onclick="addNewQuestion()">+ Add this question</button>`;
}

let newCorrect = 0;
function setNewCorrect(i) {
  newCorrect = i;
  [0, 1, 2, 3].forEach((n) => {
    const el = document.getElementById('nq-correct-' + n);
    if (el) { el.classList.toggle('on', n === i); el.textContent = n === i ? '✓' : ''; }
  });
}

function addNewQuestion() {
  const text = document.getElementById('nq-text').value.trim();
  if (!text) { showToast('Write the question first'); return; }
  const type = document.getElementById('nq-type').value;
  const q = {
    text, type,
    topic: document.getElementById('nq-topic').value.trim() || null,
    marks: Number(document.getElementById('nq-marks').value),
    difficulty: document.getElementById('nq-diff').value,
    model_answer: type === 'descriptive' ? (document.getElementById('nq-answer')?.value.trim() || null) : null,
  };
  if (type === 'mcq') {
    q.options = [0, 1, 2, 3].map((i) => document.getElementById('nq-opt-' + i).value.trim()).filter(Boolean);
    if (q.options.length < 2) { showToast('Give at least two options'); return; }
    if (newCorrect >= q.options.length) { showToast('Mark which option is correct'); return; }
    q.correct_index = newCorrect;
  }
  state.draft.newQuestions.push(q);
  showToast('Question added');
  render();
}


function documentImportForm() {
  return `
  <div class="card" style="padding:18px;">
    <div style="font-weight:700;margin-bottom:6px;">Import questions from a document</div>
    <div class="auth-hint" style="padding:0 0 12px;">
      Upload a Word <b>.docx</b> or text <b>.txt</b> file that already contains questions and answers.
      No AI is used — the system only reads the Q/A structure and imports it.
    </div>
    <input class="field" id="question-document" type="file" accept=".docx,.txt">
    <div class="auth-hint" style="padding:10px 0 12px;">
      Example: <b>Q1. What is DBMS?</b> followed by <b>Answer: A system for managing databases.</b>.
      MCQs can use A), B), C), D) options and an Answer line.
    </div>
    <button class="btn full" onclick="importQuestionDocument()">Upload & Import Questions</button>
  </div>`;
}

async function importQuestionDocument() {
  const input = document.getElementById('question-document');
  const file = input?.files?.[0];
  if (!file) { showToast('Choose a DOCX or TXT file first'); return; }
  if (!state.draft.subject.trim()) { showToast('Enter the subject in Test Details first'); return; }

  const form = new FormData();
  form.append('file', file);
  form.append('subject', state.draft.subject.trim());

  try {
    const result = await API.upload('/questions/import-document', form);
    const imported = (result.questions || []).map((q) => ({ ...q, source: 'document' }));
    state.draft.newQuestions.push(...imported);
    state.questionSource = 'document';
    showToast(`Imported ${imported.length} question${imported.length === 1 ? '' : 's'}`);
    render();
  } catch (err) {
    showToast(err.message);
  }
}

function selectedList() {
  const total = state.draft.newQuestions.length;
  if (!total) return `<div class="section"><div class="card empty"><b>No questions added yet.</b> Write questions manually or upload a question-answer document.</div></div>`;

  return `<div class="section">
    <div class="section-title">On this paper <span style="color:var(--ink-soft);font-family:'Inter';font-size:11.5px;">${total} · ${draftTotalMarks()} marks</span></div>
    <div class="card" style="padding:4px 16px;">
      ${state.draft.newQuestions.map((q, i) => `<div class="qitem">
        <div class="reorder"><span style="font-size:12px;color:var(--ink-faint);">Q${i + 1}</span></div>
        <div class="qi-text">${esc(q.text)}
          <div class="qi-marks">${q.source === 'document' ? 'Imported · ' : ''}${esc(q.type)} · ${q.marks} mark${q.marks > 1 ? 's' : ''}</div></div>
        <div class="qi-remove" onclick="removeNewQ(${i})">✕</div></div>`).join('')}
    </div></div>`;
}

function moveQ(i, dir) {
  const arr = state.bankSelected;
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  render();
}
function removeNewQ(i) { state.draft.newQuestions.splice(i, 1); render(); }

function draftTotalMarks() {
  return state.draft.newQuestions.reduce((s, q) => s + (Number(q.marks) || 0), 0);
}

function wizardNext() {
  const d = state.draft;
  if (state.createStep === 1) {
    if (!d.title.trim()) { showToast('Give the test a title'); return; }
    if (!d.batch_id) { showToast('Choose a batch'); return; }
  }
  if (state.createStep === 1 && !d.subject.trim()) { showToast('Enter the subject'); return; }
  if (state.createStep === 2 && d.newQuestions.length === 0) {
    showToast('Add at least one question'); return;
  }
  state.createStep += 1;
  render();
}
function wizardBack() { state.createStep -= 1; render(); }

// Creates and publishes in one action — the wizard's last step is "Publish
// Test", so a draft left behind would not match what the mentor was told.
async function publishDraft() {
  const d = state.draft;
  try {
    const exam = await API.post('/exams', {
      batch_id: d.batch_id,
      title: d.title,
      subject: d.subject,
      scheduled_at: new Date(`${d.date}T${d.time}`).toISOString(),
      duration_min: d.duration_min,
      passing_marks: d.passing_marks ? Number(d.passing_marks) : undefined,
      instructions: d.instructions,
      question_type: d.question_type,
      shuffle: d.settings.shuffle,
      show_result: d.settings.show_result,
      negative_marking: d.settings.negative_marking,
      proctoring: d.settings.proctoring,
      max_violations: d.settings.max_violations,
      question_ids: [],
      new_questions: d.newQuestions,
    });
    const pub = await API.post(`/exams/${exam.id}/publish`);
    showToast('Published — code ' + pub.exam_code);
    state.stack = [];
    await go('testDetail', { selectedExamId: exam.id, overviewTab: 'Overview' }, { push: false });
  } catch (err) { showToast(err.message); }
}

SCREENS.analytics = () => {
  const { stats, topics } = state.data;
  const strong = topics.filter((t) => t.band === 'strong');
  const weak = topics.filter((t) => t.band === 'weak');
  const moderate = topics.filter((t) => t.band === 'moderate');

  return `
  <div class="section">
    <div class="card chart-card">
      <div class="section-title">Batch average across tests</div>
      ${sparkline(stats.trend.map((t) => t.average_pct), stats.trend.map((_, i) => 'T' + (i + 1)))}
    </div>
    ${stats.trend.length > 1 ? `<div class="auth-hint" style="padding:0 2px;">
      ${esc(stats.trend[0].title)} → ${esc(stats.trend[stats.trend.length - 1].title)}:
      ${(stats.trend[stats.trend.length - 1].average_pct - stats.trend[0].average_pct).toFixed(1)} points.
    </div>` : ''}

  <div class="section">
    <div class="stat-grid">
      ${statCard('Tests conducted', stats.tests_conducted)}
      ${statCard('Papers submitted', stats.students_appeared)}

      ${statCard('Pass percentage', stats.pass_pct + '%', 'var(--teal)')}
    </div>
  </div>

  ${strong.length ? `<div class="section"><div class="section-title">Strong topics</div>
    <div class="card" style="padding:16px;">${strong.map((t) => bar(t.topic, t.accuracy, 'var(--teal)')).join('')}</div>
  </div>` : ''}
  ${moderate.length ? `<div class="section"><div class="section-title">Needs practice</div>
    <div class="card" style="padding:16px;">${moderate.map((t) => bar(t.topic, t.accuracy, 'var(--amber)')).join('')}</div>
  </div>` : ''}
  ${weak.length ? `<div class="section"><div class="section-title">Weak topics</div>
    <div class="card" style="padding:16px;">${weak.map((t) => bar(t.topic, t.accuracy, 'var(--coral)')).join('')}</div>
    <div class="auth-hint" style="padding:0 2px;">Accuracy across every test this class has sat. These are the topics to re-teach before the next paper.</div>
  </div>` : ''}`;
};

SCREENS.students = () => {

function setLeaderboardExam(v) { state.leaderboardExam = v; load(); }
function searchStudents(v) {
  state.searchQuery = v;
  const el = document.getElementById('scroll');
  const pos = el ? el.scrollTop : 0;
  render();
  const el2 = document.getElementById('scroll');
  if (el2) el2.scrollTop = pos;
  const input = document.querySelector('.search-bar input');
  if (input) { input.focus(); input.setSelectionRange(v.length, v.length); }
}

// Shared by the mentor's Students tab and the student's Leaderboard, so both
// read the same ranking rather than two implementations that could diverge.
function podium(list, highlightId, clickable) {
  if (!list.length) {
    return `<div class="card empty"><b>No results yet</b>Nobody has a score for this selection.</div>`;
  }
  const top3 = list.slice(0, 3);
  const rest = list.slice(3);
  const specs = [{ i: 1, h: 58, c: 'var(--gold)', big: false }, { i: 0, h: 76, c: 'var(--gold)', big: true }, { i: 2, h: 46, c: '#C1652C', big: false }];

  let podiumHtml = '';
  if (top3.length >= 2) {
    podiumHtml = `<div class="podium">${specs.filter((p) => top3[p.i]).map((p) => {
      const x = top3[p.i];
      const you = x.student_id === highlightId;
      const click = clickable ? `onclick="go('studentDetail',{selectedStudentId:${x.student_id},studentTab:'Overview'})" style="cursor:pointer;"` : '';
      return `<div class="podium-col" ${click}>
        ${p.big ? '<div style="font-size:16px;margin-bottom:2px;">👑</div>' : '<div style="height:20px;"></div>'}
        <div class="stamp" style="width:${p.big ? 46 : 36}px;height:${p.big ? 46 : 36}px;font-size:${p.big ? 13 : 11}px;margin-bottom:6px;${you ? 'border-color:var(--teal);' : ''}">${initials(x.name)}</div>
        <div class="pname">${esc(x.name.split(' ')[0])}${you ? ' <span class="you-pill">You</span>' : ''}</div>
        <div class="ppct">${x.percentage}%</div>
        <div class="podium-block" style="height:${p.h}px;background:${p.c};">${p.i + 1}</div>
      </div>`;
    }).join('')}</div>`;
  }

  const rows = (top3.length < 2 ? list : rest).map((x, i) => {
    const rank = x.rank || (top3.length < 2 ? i + 1 : i + 4);
    const you = x.student_id === highlightId;
    const click = clickable ? `onclick="go('studentDetail',{selectedStudentId:${x.student_id},studentTab:'Overview'})"` : '';
    return `<div class="student-row ${you ? 'you-row' : ''}" style="cursor:${clickable ? 'pointer' : 'default'};" ${click}>
      <div class="rank-badge ${rank === 1 ? 'top' : ''}">${rank}</div>
      <div class="stamp" style="width:36px;height:36px;font-size:11px;">${initials(x.name)}</div>
      <div class="info"><div class="nm">${esc(x.name)}${you ? ' <span class="you-pill">You</span>' : ''}</div>
        <div class="sc">${esc(x.roll_no || '')}${x.exams_taken ? ` · ${x.exams_taken} tests` : x.max_marks ? ` · ${x.score}/${x.max_marks}` : ''}</div></div>
      <span class="score-badge" style="border-color:${pctColor(x.percentage)};color:${pctColor(x.percentage)};font-size:11px;padding:4px 9px;">${x.percentage}%</span>
    </div>`;
  }).join('');

function useSuggested(text) {
  state.currentRec.recommendation = text;
  render();
}

function chips(type) {
  const cls = type === 'strengths' ? 'good' : 'bad';
  const list = state.currentRec[type];
  if (!list.length) return `<span style="font-size:11px;color:var(--ink-faint);">None added yet.</span>`;
  return list.map((c, i) => `<span class="chip ${cls}">${esc(c)} <span onclick="removeChip('${type}',${i})">✕</span></span>`).join('');
}
function addChip(type) {
  const el = document.getElementById('in-' + type);
  const v = el.value.trim();
  if (!v) return;
  state.currentRec[type].push(v);
  el.value = '';
  document.getElementById('chips-' + type).innerHTML = chips(type);
}
function removeChip(type, i) {
  state.currentRec[type].splice(i, 1);
  document.getElementById('chips-' + type).innerHTML = chips(type);
}

async function saveRecommendation() {
  const r = state.currentRec;
  if (!r.feedback.trim() && !r.recommendation.trim()) { showToast('Write some feedback first'); return; }
  try {
    await API.post(`/students/${state.selectedStudentId}/recommendations`, r);
    showToast('Recommendation saved');
    await go('recHistory', { selectedStudentId: state.selectedStudentId });
  } catch (err) { showToast(err.message); }
}

/* ----------------------------------------------- STUDENT: EXAM PLAYER -- */

async function startExam(examId) {
  try {
    const data = await API.post(`/exams/${examId}/start`);

    state.exam = data;
    state.qIndex = 0;
    state.paletteOpen = false;
    state.secondsLeft = data.attempt.seconds_remaining;
    state.questionEnteredAt = Date.now();

    // Seed local answer state from the server, so a resumed attempt comes back
    // exactly as the student left it.
    state.answers = {};
    data.questions.forEach((q) => {
      state.answers[q.exam_question_id] = {
        answer: q.answer, marked_for_review: q.marked_for_review, dirty: false,
      };
    });

    state.stack = [];
    state.screen = 'sPlayer';
    state.proctorWarning = null;
    startTicker();
    if (data.exam.proctoring) armProctoring();
    render();
  } catch (err) {
    showToast(err.message);
    if (err.data && err.data.attempt_id) go('sReport', { selectedAttemptId: err.data.attempt_id });
  }
}

// The countdown is local for smoothness but reconciled against the server every
// 15 seconds, so the clock a student sees is the clock the server enforces.
function startTicker() {
  if (state.ticker) clearInterval(state.ticker);
  let sinceSync = 0;

  state.ticker = setInterval(async () => {
    state.secondsLeft -= 1;
    sinceSync += 1;

    if (state.secondsLeft <= 0) {
      clearInterval(state.ticker);
      state.ticker = null;
      await autoSubmit();
      return;
    }

    const el = document.getElementById('timer');
    if (el) {
      el.textContent = clock(state.secondsLeft);
      el.className = 'timer ' + (state.secondsLeft < 120 ? 'danger' : state.secondsLeft < 300 ? 'warn' : '');
    }

    if (sinceSync >= 15) {
      sinceSync = 0;
      try {
        const st = await API.get(`/attempts/${state.exam.attempt.id}/status`);
        if (st.status && st.status !== 'in_progress') {
          clearInterval(state.ticker); state.ticker = null;
          showToast('Time is up — your paper was submitted');
          await go('sReport', { selectedAttemptId: state.exam.attempt.id }, { push: false });
          return;
        }
        // Trust the server's remaining time over the local drift.
        if (typeof st.seconds_remaining === 'number') state.secondsLeft = st.seconds_remaining;
      } catch { /* a dropped poll is not fatal; the next tick retries */ }
    }
  }, 1000);
}

async function autoSubmit() {
  try {
    const res = await API.post(`/attempts/${state.exam.attempt.id}/submit`);
    showToast('Time is up — your paper was submitted');
    await finishExam(res);
  } catch (err) {
    showToast(err.message);
    await goRoot('sExams');
  }
}

async function finishExam(res) {
  if (state.ticker) { clearInterval(state.ticker); state.ticker = null; }
  disarmProctoring();
  const attemptId = res.attempt_id || state.exam.attempt.id;
  state.exam = null;
  state.answers = {};
  state.stack = [];
  if (res.result_available === false) {
    showToast('Submitted — your admin will release results');
    await goRoot('sExams');
  } else {
    await go('sReport', { selectedAttemptId: attemptId }, { push: false });
  }
}

      const a = state.answers[x.exam_question_id] || {};

      ? `<button class="btn" onclick="confirmSubmit()">Submit</button>`
      : `<button class="btn" onclick="nextQ()">Next →</button>`}

function answerInput(q, local) {
  if (q.type === 'mcq') {
    return q.options.map((op, i) => `<div class="option-btn ${local.answer === i ? 'selected' : ''}"

    return `<div style="font-size:10.5px;color:var(--ink-faint);font-weight:700;margin-bottom:8px;">Select all that apply</div>` +
      q.options.map((op, i) => `<div class="option-btn ${sel.includes(i) ? 'selected' : ''}"
        onclick="pickMulti(${i})">${esc(op)}</div>`).join('');
  }
  if (q.type === 'numeric') {
    return `<input class="num-input" type="number" step="any" placeholder="Your answer"
      value="${local.answer ?? ''}" oninput="setValue(this.value===''?null:Number(this.value))">`;
  }
  return `<textarea class="field" rows="7" placeholder="Write your answer…"
    oninput="setValue(this.value)">${esc(local.answer ?? '')}</textarea>`;
}

function paletteSheet(questions, answered) {
  const marked = questions.filter((x) => (state.answers[x.exam_question_id] || {}).marked_for_review).length;
  return `<div class="palette-sheet" onclick="togglePalette()">

      <div class="palette-grid">
        ${questions.map((x, i) => {
          const a = state.answers[x.exam_question_id] || {};
          const has = a.answer !== null && a.answer !== undefined && a.answer !== '';
          const cls = a.marked_for_review ? 'review' : has ? 'answered' : '';
          return `<button class="pcell ${cls} ${i === state.qIndex ? 'current' : ''}" onclick="jumpTo(${i})">${i + 1}</button>`;
        }).join('')}

      <div style="margin-top:16px;"><button class="btn full" onclick="confirmSubmit()">Submit exam</button></div>
